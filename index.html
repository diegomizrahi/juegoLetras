<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abecedario Dual con Sonido</title>
    <style>
        :root { --azul: #007AFF; --gris: #8E8E93; --fondo: #F2F2F7; --rojo: #FF3B30; --verde: #34C759; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--fondo);
            margin: 0; padding: 10px;
            display: flex; flex-direction: column; align-items: center;
            user-select: none; touch-action: manipulation;
        }
        .cabecera { text-align: center; height: 50px; margin-top: 5px; }
        #txt-mayus { font-size: 1.8rem; font-weight: 800; color: var(--azul); display: block; }
        #txt-minus { font-size: 1.2rem; color: var(--gris); display: block; }
        .cuadro-imagen {
            width: 180px; height: 180px; background: #FFF; border-radius: 25px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05); margin: 10px 0;
            border: 1px solid #E5E5EA;
        }
        #imagen-principal { width: 85%; height: 85%; object-fit: contain; }
        #mensaje-feedback { height: 25px; font-weight: 700; font-size: 1.1rem; margin-bottom: 5px; text-align: center; }
        #progreso { font-size: 2.2rem; font-weight: 900; letter-spacing: 4px; margin-bottom: 10px; color: #1C1C1E; }
        .error-shake { animation: shake 0.4s; color: var(--rojo) !important; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        .teclado { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; width: 100%; max-width: 420px; }
        .tecla {
            aspect-ratio: 1/1; background: #FFF; border: none; border-radius: 12px;
            box-shadow: 0 4px 0 #D1D1D6; display: flex; flex-direction: column; 
            justify-content: center; align-items: center;
        }
        .tecla span.M { font-size: 1.2rem; font-weight: 800; color: #000; }
        .tecla span.m { font-size: 0.9rem; color: var(--gris); }
        .tecla:active { transform: translateY(4px); box-shadow: none; background: #F2F2F7; }
    </style>
</head>
<body>

    <div class="cabecera">
        <span id="txt-mayus">...</span>
        <span id="txt-minus">...</span>
    </div>

    <div class="cuadro-imagen">
        <img id="imagen-principal" src="" alt="">
    </div>

    <div id="mensaje-feedback"></div>
    <div id="progreso">_ _ _</div>
    <div class="teclado" id="teclado"></div>

    <script>
        // Diccionario de 500 palabras (Compactado para el ejemplo, pero listo para todas)
        const diccionario = [
            {es:"AVION", en:"airplane"}, {es:"PERRO", en:"dog"}, {es:"GATO", en:"cat"},
            {es:"ABEJA", en:"bee"}, {es:"BOTA", en:"boot"}, {es:"CASA", en:"house"},
            {es:"DADO", en:"dice"}, {es:"ELEFANTE", en:"elephant"}, {es:"FLOR", en:"flower"},
            {es:"HELADO", en:"ice cream"}, {es:"ISLA", en:"island"}, {es:"JIRAFA", en:"giraffe"},
            {es:"LUNA", en:"moon"}, {es:"MANZANA", en:"apple"}, {es:"OSO", en:"bear"},
            {es:"PELOTA", en:"ball"}, {es:"QUESO", en:"cheese"}, {es:"RATON", en:"mouse"},
            {es:"SOL", en:"sun"}, {es:"TREN", en:"train"}, {es:"UVA", en:"grapes"},
            {es:"VACA", en:"cow"}, {es:"ZAPATO", en:"shoe"}
            // ... (Se pueden seguir añadiendo las 500 aquí)
        ];

        let actual = {};
        let escrito = "";

        // Función de voz y sonidos
        function hablar(texto) {
            const mensaje = new SpeechSynthesisUtterance(texto);
            mensaje.lang = 'es-ES';
            mensaje.rate = 1.1; 
            window.speechSynthesis.speak(mensaje);
        }

        function mostrarFeedback(msg, color, esExito) {
            const el = document.getElementById('mensaje-feedback');
            el.innerText = msg;
            el.style.color = color;
            
            if (esExito) {
                hablar("¡Excelente!");
            } else {
                hablar("Vamos, puedes hacerlo mejor");
            }
            
            setTimeout(() => { el.innerText = ""; }, 2000);
        }

        function iniciar() {
            actual = diccionario[Math.floor(Math.random() * diccionario.length)];
            escrito = "";
            document.getElementById('txt-mayus').innerText = actual.es;
            document.getElementById('txt-minus').innerText = actual.es.toLowerCase();
            document.getElementById('imagen-principal').src = `https://loremflickr.com/400/400/${actual.en},drawing/all`;
            dibujar();
        }

        function dibujar() {
            let p = "";
            for(let i=0; i<actual.es.length; i++) {
                p += (i < escrito.length ? actual.es[i] : "_") + " ";
            }
            document.getElementById('progreso').innerText = p.trim();
        }

        function tocarLetra(l) {
            const letraCorrecta = actual.es[escrito.length];
            if (l === letraCorrecta) {
                escrito += l;
                // Sonido de clic suave al acertar cada letra
                const click = new AudioContext();
                const osc = click.createOscillator();
                const gain = click.createGain();
                osc.connect(gain); gain.connect(click.destination);
                osc.frequency.value = 600; osc.start(); 
                gain.gain.exponentialRampToValueAtTime(0.0001, click.currentTime + 0.1);
                
                dibujar();
                if (escrito === actual.es) {
                    mostrarFeedback("¡EXCELENTE! 👏👏👏", "var(--verde)", true);
                    setTimeout(iniciar, 2500);
                }
            } else {
                document.getElementById('progreso').classList.add('error-shake');
                mostrarFeedback("¡Vamos, puedes hacerlo mejor!", "var(--rojo)", false);
                setTimeout(() => { 
                    document.getElementById('progreso').classList.remove('error-shake');
                }, 400);
            }
        }

        const abc = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split("");
        abc.forEach(letra => {
            const btn = document.createElement('div');
            btn.className = 'tecla';
            btn.innerHTML = `<span class="M">${letra}</span><span class="m">${letra.toLowerCase()}</span>`;
            btn.onclick = () => tocarLetra(letra);
            document.getElementById('teclado').appendChild(btn);
        });

        // Nota: Los navegadores bloquean audio automático. 
        // El primer clic del niño activará el sistema de sonido.
        iniciar();
    </script>
</body>
</html>
