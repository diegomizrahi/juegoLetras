        :root { --azul: #007AFF; --gris: #8E8E93; --fondo: #F2F2F7; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--fondo);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
        }
        .cabecera { text-align: center; margin-bottom: 10px; }
        #txt-mayus { font-size: 2.2rem; font-weight: 800; color: var(--azul); display: block; }
        #txt-minus { font-size: 1.5rem; color: var(--gris); font-weight: 500; display: block; }
        .cuadro-imagen {
            width: 280px; height: 280px; background: #FFF; border-radius: 30px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin: 15px 0;
            border: 1px solid #E5E5EA; overflow: hidden;
        }
        #imagen-principal { width: 100%; height: 100%; object-fit: cover; }
        #progreso {
            font-size: 2.8rem; font-weight: 900; letter-spacing: 6px;
            margin: 15px 0; color: #1C1C1E; text-transform: uppercase; min-height: 50px;
        }
        .teclado {
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px;
            width: 100%; max-width: 400px;
        }
        .tecla {
            aspect-ratio: 1/1; background: #FFF; border: none; border-radius: 12px;
            font-size: 1.3rem; font-weight: 600; color: #000;
            box-shadow: 0 4px 0 #D1D1D6; display: flex; justify-content: center;
            align-items: center; -webkit-tap-highlight-color: transparent;
        }
        .tecla:active { transform: translateY(4px); box-shadow: none; background: #E5E5EA; }
        @media (max-width: 375px) {
            .cuadro-imagen { width: 220px; height: 220px; }
            #progreso { font-size: 2rem; }
            .teclado { grid-template-columns: repeat(6, 1fr); }
        }
    </style>

            document.getElementById('imagen-principal').src = `https://loremflickr.com/400/400/${query},drawing/all`;

            let p = "";
            for(let i=0; i<actual.es.length; i++) {

            }
            document.getElementById('progreso').innerText = p.trim();
        }

        function tocarLetra(l) {
            if (l === actual.es[escrito.length]) {
                escrito += l;
                dibujar();
                if (escrito === actual.es) {

                    }, 300);
